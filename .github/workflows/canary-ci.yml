name: Canary CI

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  prepare:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/canary-ci run') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      react_version: ${{ steps.get-version.outputs.react_version }}
      head_sha: ${{ steps.get-head.outputs.head_sha }}
    steps:
      - name: Get React version from comment
        id: get-version
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          comment="$COMMENT_BODY"
          # Extract version after '/canary-ci run', defaulting to 'canary' if not specified
          version=$(echo "$comment" | sed -n 's/^\/canary-ci run\s*\([A-Za-z0-9._@/+-]*\).*/\1/p')
          if [ -z "$version" ]; then
            version="canary"
          fi
          echo "react_version=$version" >> $GITHUB_OUTPUT
      - name: Get the PR head commit at comment time
        id: get-head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          echo "head_sha=$head_sha" >> $GITHUB_OUTPUT

  canary-ci-e2e:
    needs: prepare
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ needs.prepare.outputs.head_sha }}
      react_version: ${{ needs.prepare.outputs.react_version }}

  canary-ci-test:
    needs: prepare
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.prepare.outputs.head_sha }}
      react_version: ${{ needs.prepare.outputs.react_version }}
